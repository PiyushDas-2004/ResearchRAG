name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check src tests scripts && ruff format --check src tests scripts
      - name: mypy --strict
        run: mypy --strict src/researchrag
      - name: bandit
        run: bandit -q -r src -c pyproject.toml
      - name: pip-audit
        run: pip-audit --skip-editable --progress-spinner off

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: researchrag
          POSTGRES_PASSWORD: researchrag
          POSTGRES_DB: researchrag_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U researchrag -d researchrag_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      RR_TEST_DATABASE_URL: postgresql+asyncpg://researchrag:researchrag@localhost:5432/researchrag_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "${{ matrix.python }}", cache: pip}
      - name: Install tesseract (OCR fallback test)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - run: pip install -e ".[dev]"
      - name: Tests with coverage gate (85%)
        run: pytest --cov=researchrag --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v5
        if: matrix.python == '3.12'
        with: {name: coverage, path: coverage.xml}

  eval-gate:
    runs-on: ubuntu-latest
    needs: lint-type
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e .
      - name: Offline evaluation regression gate (fake embedder + mock LLM, deterministic)
        run: researchrag eval check --baseline main
      - name: Offline evaluation report
        if: always()
        run: researchrag eval run --out reports
      - uses: actions/upload-artifact@v5
        if: always()
        with: {name: eval-report, path: reports/}

  docker:
    runs-on: ubuntu-latest
    needs: lint-type
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t researchrag:ci .
      - name: Smoke test the image (offline)
        run: |
          docker network create rr
          docker run -d --name db --network rr -e POSTGRES_USER=researchrag -e POSTGRES_PASSWORD=researchrag -e POSTGRES_DB=researchrag pgvector/pgvector:pg16
          for i in $(seq 1 30); do docker exec db pg_isready -U researchrag && break; sleep 1; done
          docker run -d --name api --network rr -p 8000:8000 \
            -e RR_DATABASE_URL=postgresql+asyncpg://researchrag:researchrag@db:5432/researchrag \
            -e RR_RUN_MIGRATIONS_ON_STARTUP=true -e RR_API_KEYS=ci-key researchrag:ci
          for i in $(seq 1 60); do curl -fsS localhost:8000/ready && break; sleep 1; done
          curl -fsS localhost:8000/ready
      - name: Container vulnerability scan (Trivy, report only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: researchrag:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: 1.9.8}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
