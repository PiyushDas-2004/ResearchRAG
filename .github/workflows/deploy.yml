name: Deploy to Cloud Run (manual)

# Disabled until configured: set repository variables GCP_PROJECT_ID, GCP_REGION,
# GCP_WIF_PROVIDER and GCP_DEPLOY_SA (outputs of infra/terraform). Uses Workload Identity
# Federation: no long-lived service-account keys are stored in GitHub.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/researchrag/api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and push
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Deploy new revision
        run: |
          gcloud run deploy researchrag --image "$IMAGE" --region "${{ vars.GCP_REGION }}" --quiet
      - name: Smoke test
        run: |
          URL=$(gcloud run services describe researchrag --region "${{ vars.GCP_REGION }}" --format 'value(status.url)')
          curl -fsS "$URL/health"
          curl -fsS "$URL/ready"
