[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "researchrag"
version = "0.1.0"
description = "Citation-grounded question answering over academic papers: hybrid pgvector retrieval, reranking, claim-level verification and built-in evaluation."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Piyush Pradeep Das" }]
requires-python = ">=3.11"
keywords = ["rag", "retrieval-augmented-generation", "pgvector", "llm-evaluation", "fastapi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3",
  "pymupdf>=2.1",
  "reportlab>=4.2",
  "structlog>=24.1",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "prometheus-client>=0.20",
  "typer>=0.12",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "rapidfuzz>=3.9",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
gemini = ["google-genai>=1.0"]
tiktoken = ["tiktoken>=0.7"]
local = ["sentence-transformers>=3.0"]
ocr = ["pytesseract>=0.3.10"]
all = ["researchrag[openai,gemini,tiktoken]"]
dev = [
  "researchrag[openai,gemini,tiktoken]",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "testcontainers[postgres]>=4.7",
  "psycopg[binary]>=3.2",
  "ruff>=0.17,<0.18",  # pinned: lint rules change between minor versions
  "mypy>=2.4,<2.5",  # pinned: strict-mode diagnostics change between versions
  "types-PyYAML>=6.0",
  "bandit>=1.7.9",
  "pip-audit>=2.7",
  "pre-commit>=3.7",
  "locust>=2.29",
]

[project.scripts]
researchrag = "researchrag.cli:app"

[project.urls]
Homepage = "https://github.com/PiyushDas-2004/ResearchRAG"
Issues = "https://github.com/PiyushDas-2004/ResearchRAG/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/researchrag"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "PL", "PT", "ASYNC", "TID", "RET"]
ignore = [
  "PLR0913", # many-argument constructors are fine for config-driven components
  "PLR0917",
  "PLR2004", # magic numbers are fine in heuristics with named context
  "PLR0911",
  "PLR0912",
  "PLR0915",
  "RUF001",
  "RUF002",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "PLR2004", "PLC0415", "S608", "PT018", "PT011", "B017", "PT012"]
"scripts/**" = ["S", "T201", "PLC0415"]
"loadtest/**" = ["S311"]
"src/researchrag/storage/migrations/**" = ["N999"]
"src/researchrag/evaluation/report.py" = ["E501"]  # inline HTML templates

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"openai".msg = "Provider SDKs may only be imported inside provider adapter modules."
"google.genai".msg = "Provider SDKs may only be imported inside provider adapter modules."

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["researchrag"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pymupdf.*", "fitz.*", "reportlab.*", "pgvector.*", "asyncpg.*", "rapidfuzz.*", "sentence_transformers.*", "pytesseract.*", "tiktoken.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers -m 'not live'"
markers = [
  "live: calls real LLM/embedding providers; needs API keys (skipped by default)",
  "db: needs a PostgreSQL+pgvector database",
  "slow: slower end-to-end tests",
]
filterwarnings = [
  "ignore::DeprecationWarning:testcontainers.*",
  "ignore::DeprecationWarning:reportlab.*",
]

[tool.coverage.run]
source = ["researchrag"]
branch = true
omit = ["src/researchrag/storage/migrations/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]

[tool.bandit]
exclude_dirs = ["tests", "scripts", "loadtest"]
