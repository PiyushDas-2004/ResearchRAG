key: clim-02
title: "Reflective Roof Retrofits and Afternoon Cooling in Port Calderan: A Four-Summer Evaluation"
authors: ["Kasimir Oyelaran-Dahl", "Juniper Mbeki-Torvald", "Haruto Vasquez-Ellery", "Signe Rautaleht"]
affiliation: "Urban Climate Group, Calderan School of Environmental Design"
year: 2023
venue: "Urban Thermal Environments Review"
doi: "10.5555/rrsyn.2023.clim02"
arxiv_id: "2399.11206"
keywords: ["urban heat island", "cool roofs", "albedo", "difference-in-differences", "microclimate network"]
abstract: >-
  Port Calderan, a coastal city of about 410,000 people at the mouth of the Tarn River, has warmed
  by 0.47 degrees C per decade in summer since 1990. In 2020 and 2021 the municipal CoolCrown
  programme coated 3,280 roofs with a high-albedo membrane, raising roof solar reflectance from 0.14
  to 0.71. We evaluated the programme with 212 street-level sensors of the Calder Microclimate
  Network (CMN) in six treated and six matched control districts over the summers of 2019-2022. A
  difference-in-differences model estimated a mean afternoon air temperature reduction of 0.83
  degrees C in treated districts, rising to 1.6 degrees C on days above 32 degrees C, with a much
  smaller night-time reduction of 0.21 degrees C. Afternoon heat island intensity, measured against
  a reference station on the Vellmar Estuary high marsh, fell from 3.9 to 3.1 degrees C in treated
  districts. Coating reflectance degraded to 0.62 after 18 months, so recoating will be needed to
  sustain the benefit.
sections:
  - title: "Introduction"
    paragraphs:
      - "Urban heat islands raise air temperatures in cities above those of the surrounding land, increasing heat stress and the demand for cooling energy. Port Calderan, a coastal city of about 410,000 people built on the northern bank of the Tarn River where it enters the Vellmar Estuary, has seen its summer mean air temperature rise by 0.47 degrees C per decade between 1990 and 2019, faster than the surrounding countryside. Dense mid-rise districts with dark bitumen roofs occupy most of the city centre, and summer peak electricity demand in the city grew by roughly a third between the 2000s and the 2010s according to utility records."
      - "Raising the reflectance of roofs is one of the cheapest heat mitigation options, but evidence on how much it cools street-level air, as opposed to roof surfaces, remains mixed. In 2020 the city launched the CoolCrown programme, which subsidised the application of a white elastomeric membrane to flat and low-pitched roofs. The staggered rollout, which treated some districts and not others, created an opportunity for a quasi-experimental evaluation. This paper reports the first full evaluation of CoolCrown, asking how much it reduced afternoon and night-time air temperature, how it changed heat island intensity, and how durable the coating proved."
  - title: "Methods"
    paragraphs:
      - "The Calder Microclimate Network (CMN) consists of 212 ventilated temperature and humidity sensors mounted at 2 m height on lamp posts across Port Calderan, logging every 10 minutes since May 2019. A rural reference station was installed on the high marsh of the Vellmar Estuary, at a weather mast first erected during the sediment coring campaign of Achterberg-Nwosu et al. (2021), about 6 km from the city centre. Heat island intensity was defined as the difference in air temperature between the mean of all CMN sensors in a district and the marsh reference station."
      - "Six districts received CoolCrown retrofits between April 2020 and June 2021, together covering 3,280 roofs. Six control districts were matched on building height, roof area fraction, distance from the shoreline and baseline 2019 temperature. Of the 212 CMN sensors, 94 lay in treated districts and 88 in control districts, with the remainder elsewhere in the city. We fitted a difference-in-differences model to hourly temperatures for June to August of 2019 to 2022, with district and day fixed effects, and report effects for an afternoon window of 14:00 to 17:00 and a night window of 01:00 to 04:00."
      - "Roof reflectance was measured with a field spectrometer on a random sample of 150 retrofitted roofs immediately after coating and again 18 months later. Roof surface temperatures were mapped by a drone-mounted thermal camera on three clear afternoons in July 2021. To estimate effects on cooling energy, we obtained metered electricity data for 418 air-conditioned buildings in treated districts and compared summer 2022 use with summer 2019 use after normalising for cooling degree days."
      - "Sensor data underwent quality control before analysis. Readings were removed when the ventilation fan of a radiation shield failed or when a sensor deviated by more than 1.5 degrees C from the median of its five nearest neighbours for over two hours, and together these rules removed 3.4 percent of hourly values. All sensors were intercompared in a climate chamber before deployment and again in March 2022, and drift over that period averaged 0.04 degrees C, which is small relative to the effects reported here."
  - title: "Results"
    paragraphs:
      - "Coating raised mean roof solar reflectance from 0.14 to 0.71, and drone surveys showed coated roofs averaging 18.5 degrees C cooler than adjacent uncoated roofs on clear afternoons. At street level the effect was much smaller but clear. Averaged across the six treated districts, the difference-in-differences estimate of afternoon cooling was 0.83 degrees C (95 percent confidence interval 0.61 to 1.05). Cooling scaled with the fraction of district area covered by retrofitted roofs, from 1.12 degrees C in Harbourside to 0.61 degrees C in Saltgate (Table 1)."
      - "Effects were largest during heat waves. On the 23 days when the marsh reference station exceeded 32 degrees C, afternoon cooling in treated districts averaged 1.6 degrees C. Night-time effects were small, with a mean reduction of 0.21 degrees C, consistent with the low heat storage of thin roof membranes. Afternoon heat island intensity in treated districts fell from 3.9 degrees C in 2019 to 3.1 degrees C in 2022, whereas in control districts it changed little, from 3.8 to 3.7 degrees C."
      - "Metered electricity use for cooling in the 418 surveyed buildings fell by 11 percent after normalising for cooling degree days. Roof reflectance declined over time as dirt and biological growth accumulated, falling from 0.71 to 0.62 after 18 months, and the afternoon cooling estimate for summer 2022 alone, 0.76 degrees C, was lower than that for summer 2021, 0.90 degrees C."
