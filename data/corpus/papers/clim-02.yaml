  - title: "Discussion"
    paragraphs:
      - "CoolCrown delivered a measurable but modest reduction in street-level afternoon air temperature, roughly a fifth of the 3.9 degrees C baseline heat island. The near-linear dependence of cooling on roof area fraction suggests that further gains require coating a larger share of the roofscape within districts rather than treating more districts at low density. Because the city has warmed by 0.47 degrees C per decade, the programme's afternoon cooling of 0.83 degrees C offsets less than two decades of summer warming in the treated districts."
      - "The marsh reference station proved useful but imperfect. The Vellmar high marsh is open and well ventilated, and its sediments remain moist through summer, which makes it cooler than dry farmland further inland. Heat island intensities measured against it are therefore larger than they would be against an agricultural reference. The CMN sensor design has since been adopted elsewhere in the Tarn valley, including on farmland transects in the Brennick Lowlands, which should allow future comparisons between urban and rural warming using identical instruments."
      - "The larger cooling on hot days is encouraging because those days drive peak electricity demand in the city. During the 23 hottest days, the reduction in afternoon temperature coincided with a 14 percent lower peak load at the two substations serving Harbourside and Old Mint, although we cannot separate roof effects from changes in building occupancy over the same period. A comparison with rural warming trends in the wider Tarn valley will become possible once several summers of data from the farmland sensors are available."
  - title: "Limitations"
    paragraphs:
      - "The study has several limitations. Treatment was not randomised, and although control districts were matched on four characteristics, unmeasured differences such as street tree planting could bias the estimates. We did not measure winter heating penalties, which could offset part of the energy saving, and we received 37 complaints of glare from residents of taller neighbouring buildings without quantifying the glare itself. Finally, four summers are a short record, and the decline in reflectance means that the long-term effect depends on recoating schedules that the city has not yet set."
  - title: "Conclusion"
    paragraphs:
      - "Coating 3,280 roofs in six Port Calderan districts reduced afternoon street-level air temperature by 0.83 degrees C on average and by 1.6 degrees C on the hottest days, and cut afternoon heat island intensity from 3.9 to 3.1 degrees C. Gains were concentrated where retrofitted roofs cover a large share of district area. Maintaining reflectance through periodic recoating will be necessary to sustain the benefit as the city continues to warm."
