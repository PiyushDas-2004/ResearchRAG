  - title: "Discussion"
    paragraphs:
      - "The main message is that wrist step counts are trustworthy at ordinary walking speeds and unreliable at slow speeds, with the gap large enough to matter for epidemiological work. A study that compares activity across age groups, or that uses steps as a proxy for time spent outside the home, will exaggerate differences between slow and fast walkers if raw counts are used. Ranking of participants by activity is fairly robust, because the Spearman correlation between device and video totals was 0.93 for the Pacewell Band 3, but absolute levels at the low end are biased downward."
      - "CadenceFloor is deliberately simple. It needs only minute-level counts, which most cohort exports already contain, and it can be applied retrospectively to existing HALO data. We have released the fitted coefficients for the Pacewell Band 3 so that modelling groups using HALO activity quintiles can apply them. We expect that models which convert activity into contact rates or exposure time will be most sensitive to the correction, because the lowest activity quintile is where raw counts are most distorted."
  - title: "Limitations"
    paragraphs:
      - "Several limitations apply. All conditions were performed indoors on a flat loop or a single stairwell, so outdoor terrain, cold weather and carried loads were not represented. Devices were worn only on the non-dominant wrist, and we did not test dominant-wrist placement, which may change error during tasks such as the kitchen condition. The sample was 71 percent under 60 years of age, and only 11 participants used a walking frame in daily life, so estimates for frail walkers are imprecise. Finally, CadenceFloor was fitted for one firmware version and may need refitting after updates."
  - title: "Conclusion"
    paragraphs:
      - "Against a two-camera video reference, three wrist devices undercounted steps, with pooled MAPE between 7.9 and 13.4 percent and much larger errors during slow and assisted walking. A speed-dependent correction roughly halved slow-walk error for the best device. We recommend that cohorts reporting wrist step counts state the walking-speed mix of their validation and, where slow walkers are common, apply a correction such as CadenceFloor before using counts as exposure variables."
