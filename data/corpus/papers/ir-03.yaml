  - title: "Discussion"
    paragraphs:
      - "The preference for 256-token chunks is consistent with the passage length on which BraidRank was trained, and it is possible that a retriever trained on longer passages would shift the optimum upward. Even so, the size of the effect is striking: the gap between the best and worst segmentation choices is larger than the gap between BraidRank and a classical lexical baseline on QuarryQA. Segmentation deserves the same reporting discipline as model choice, and papers that evaluate retrieval-augmented generation on long documents should state chunk size and overlap explicitly."
      - "Structure-aware chunking did not beat a well-chosen fixed window in our experiments, but its errors were different in kind. SectionCut rarely split an answer across chunks, yet its many very short chunks, such as figure captions, were often retrieved in place of the body text they summarised. A hybrid strategy that merges short sections with their neighbours is a natural next step."
  - title: "Limitations"
    paragraphs:
      - "We used a single retriever and a single reranker, both trained on short scientific passages, so the optimal settings may differ for other models. LongLedger documents are English and technical, and conversational or narrative documents may favour different chunk sizes. Answer-complete recall is deliberately strict and may undervalue chunks that contain enough of the answer for a generator to succeed. We also did not measure how chunking affects the final quality of generated answers."
  - title: "Conclusion"
    paragraphs:
      - "Chunk size and overlap move answer-complete Recall@10 on long technical documents by up to 16 points, more than many retriever improvements. For BraidRank on LongLedger, 256-token chunks with 25 percent overlap gave 0.742 before reranking and 0.801 after reranking with Kestrel-CE-base. We release LongLedger, its answer-span annotations and our chunking scripts so that segmentation can be reported, tuned and compared across studies rather than silently inherited from library defaults."
