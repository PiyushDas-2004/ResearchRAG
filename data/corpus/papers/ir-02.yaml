  - title: "Discussion"
    paragraphs:
      - "The depth curves flatten early because a strong hybrid first stage already places most gold passages near the top. When the first stage is weak, deeper reranking can compensate, but with BraidRank the marginal candidate beyond rank 50 is rarely relevant. Model size matters more than depth: Kestrel-CE-base at depth 50 beats Kestrel-CE-small at depth 200 while running faster. For teams choosing a single configuration under a latency budget near 100 ms, a mid-sized model at moderate depth is the most efficient choice we observed."
      - "The success of StopGap rests on the observation that the small model's score margin is a usable confidence signal. Among queries resolved in the first stage, the small model's top-ranked passage was relevant 83 percent of the time, compared with 51 percent for queries passed on to the large model. Cascades of this kind are attractive for retrieval-augmented generation, where the reranked passages feed a language model and the end-to-end latency budget is shared with generation."
      - "We also examined 150 queries on which Kestrel-CE-large at depth 100 demoted a gold passage out of the top ten. In 62 of these cases the gold passage stated the answer only as a number inside a flattened table, and the reranker preferred a neighbouring passage that discussed the same quantity in prose without giving its value. Another 41 cases involved passages that were cut mid-sentence by the original QuarryQA segmentation, suggesting that how documents are divided into passages limits what any reranker can recover."
  - title: "Limitations"
    paragraphs:
      - "All experiments use one benchmark, QuarryQA, whose passages are short and uniform in length. Long or irregular passages would raise the cost of each forward pass and might change the optimal depth. We measured latency for single queries rather than under concurrent load, so throughput-oriented deployments may see different trade-offs. Finally, the StopGap threshold was tuned on the same benchmark and may need recalibration for other collections."
  - title: "Conclusion"
    paragraphs:
      - "Reranking depth is a costly default that deserves measurement. On BraidRank candidates for QuarryQA, depths beyond 100 bought almost nothing, a mid-sized cross-encoder at depth 50 offered a strong balance, and the StopGap cascade kept 0.596 nDCG@10 at a 95th-percentile latency of 158 ms. We release the Kestrel checkpoints and the cascade configuration so that others can reproduce these curves on their own collections."
