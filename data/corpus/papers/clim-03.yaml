  - title: "Discussion"
    paragraphs:
      - "The decline of 37 percent in wild bees over ten years is large, and the contrast between hedgerow and open-field transects suggests that woody field boundaries buffer pollinators against both pesticides and heat. Hedgerows provide nesting sites, early-season flowers and shade, and our sensors recorded afternoon temperatures that were on average 1.4 degrees C lower along hedgerows than along open edges on days above 30 degrees C. The temperature association in the mixed model persisted after accounting for spray intensity, indicating that warming acts in addition to farm management rather than merely tracking it."
      - "Using the Calder Microclimate Network sensor design allowed the first like-for-like comparison of rural and urban warming in the Tarn valley. The plain warmed somewhat more slowly than Port Calderan, but farmland lacks the shade and engineered cooling options available to cities, such as the reflective roofs evaluated by Oyelaran-Dahl et al. (2023). The Brennick Lowlands also lie beside the middle Tarn River, whose summer water temperature is moderated by glacial meltwater, and whether cooler riparian strips offer pollinators a thermal refuge is an open question for the scheme."
      - "The scale of decline has practical implications for crop pollination in the valley. Field beans and orchard fruit in the Brennick Lowlands depend heavily on wild bees, because few farms keep managed hives and those insects were excluded from our counts. If the open-field trend continued at the same rate, wild bee counts there would halve again within about a decade. We did not measure crop yield or fruit set, so the consequences for production remain to be quantified, but the scheme now provides a baseline against which pollination deficits could be tested."
  - title: "Limitations"
    paragraphs:
      - "Several limitations should be noted. A change of lead recorder in 2018 coincided with the largest annual drop, and although recorder was included as a random effect, some of the decline in that year may reflect differences in detection. Transect walks record only active, visible insects, and we did not use pan traps or nest surveys, so small or cryptic species are under-represented. Identification to morphogroup rather than species for some bees and hoverflies limits species-level conclusions, and temperatures before 2018 were reconstructed rather than measured on site."
  - title: "Conclusion"
    paragraphs:
      - "Ten years of standardised BPTS counts show a 37 percent decline in wild bees on Brennick Lowlands farmland, with smaller but substantial declines in hoverflies and butterflies. Declines were concentrated on open-field transects and were associated with both warmer Julys and higher spray intensity. Retaining and restoring hedgerows emerges as the most promising local measure suggested by the data, and continued paired monitoring of counts and microclimate will be needed to track whether it is sufficient."
