key: clim-03
title: "A Decade of Wild Pollinator Decline Along Brennick Lowlands Farmland Transects"
authors: ["Odalys Fenwright", "Benedek Saramago-Lund", "Priya Halloway-Chen"]
affiliation: "Agroecology Unit, Tarnside Agricultural College"
year: 2024
venue: "Annals of Synthetic Agroecology"
doi: "10.5555/rrsyn.2024.clim03"
keywords: ["pollinators", "wild bees", "farmland biodiversity", "hedgerows", "transect monitoring"]
abstract: >-
  Wild pollinators support crop yields and wild plant reproduction, yet long-term standardised
  monitoring on farmland remains scarce. We analysed ten years (2014-2023) of the Brennick
  Pollinator Transect Scheme (BPTS), comprising 2,160 walks along 36 fixed 1 km transects in the
  farmland of the Tarn valley. Mean wild bee counts fell by 37 percent between 2014-2015 and
  2022-2023, hoverflies by 21 percent and butterflies by 29 percent, and mean species richness per
  transect dropped from 24.6 to 17.9. Declines were far steeper on open-field transects (48 percent
  for wild bees) than on transects bordered by hedgerows (14 percent). Sensors built to the Calder
  Microclimate Network design, deployed at 18 transects, showed the number of days above 30 degrees
  C rising from 4 to 11 per season. A mixed model associated each 1 degree C rise in mean July
  temperature with 8.4 percent lower wild bee abundance.
sections:
  - title: "Introduction"
    paragraphs:
      - "Insect pollinators visit the flowers of most crops grown in the Tarn valley, including field beans, oilseed rape and orchard fruit, and they sustain the wildflowers of field margins. Declines in pollinators have been reported from many farmed landscapes, but much of the evidence comes from short studies or from presence records rather than standardised counts. The Brennick Lowlands, a 640 km^2 alluvial plain about 40 km upstream of Port Calderan, provide an unusual opportunity because staff and volunteer recorders have walked the same fixed transects every summer since 2014."
      - "Two drivers are frequently proposed for farmland pollinator decline: loss of semi-natural habitat such as hedgerows and flower-rich margins, and rising summer temperatures that push species beyond their thermal tolerance. These drivers are hard to separate, because habitat loss and warming have often proceeded together. Here we combine ten years of transect counts with on-site microclimate measurements to estimate the trend in wild pollinator abundance and richness, to compare transects with and without hedgerows, and to estimate the association between summer temperature and wild bee abundance."
  - title: "Methods"
    paragraphs:
      - "The Brennick Pollinator Transect Scheme (BPTS) comprises 36 fixed transects, each 1 km long and 4 m wide, placed by stratified random selection across the arable and mixed farms of the plain. Twelve transects run along hedgerows and 24 run along open field edges without woody vegetation. Each transect was walked once per month from April to September in every year from 2014 to 2023, giving 2,160 walks in total. Walks took place between 10:00 and 16:00 on days with less than 50 percent cloud cover, light wind and air temperature above 13 degrees C."
      - "Recorders counted all wild bees, hoverflies and butterflies seen within 2 m on either side of the transect line. Wild bees and hoverflies were identified to species where possible and otherwise to one of 11 morphogroups, while butterflies were identified to species. Managed honeybees were excluded from the counts. Over the ten years recorders logged 48,915 individual wild pollinators belonging to 112 species. Farm management was summarised each year with the Lowland Spray Intensity Index (LSII), a score from 0 to 10 derived from farmer-reported insecticide application frequency within 500 m of each transect."
      - "In 2018 we installed microclimate sensors at 18 of the transects, using the same ventilated sensor housing and 2 m mounting height as the Calder Microclimate Network operated in Port Calderan (Oyelaran-Dahl et al., 2023), so that rural and urban temperatures could be compared directly. For years before 2018, transect temperatures were reconstructed from a regional weather station using a calibration regression with an r^2 of 0.91. Abundance was modelled with a negative binomial generalised linear mixed model including year, habitat type, mean July temperature and LSII as fixed effects and transect and recorder as random effects."
  - title: "Results"
    paragraphs:
      - "Counts of all three groups declined between the first two and the last two years of the record (Table 1). Mean wild bee counts per walk fell from 61.2 to 38.6, a 37 percent decline, while hoverflies declined by 21 percent and butterflies by 29 percent. The year-on-year trend in wild bees was negative in seven of the nine intervals, with the sharpest single drop, 15 percent, between 2018 and 2019 following the hottest summer in the record. Mean species richness per transect per year fell from 24.6 to 17.9 species."
      - "Habitat strongly modified the trend (Table 2). Transects bordered by hedgerows lost 14 percent of their wild bees over the decade, while open-field transects lost 48 percent. Open-field transects were also sprayed more intensively, with a mean LSII of 5.7 in 2023 compared with 3.1 along hedgerows. The difference between habitats was consistent across years, with hedgerow transects recording higher wild bee counts than open-field transects in every season, and the gap widened from 1.3-fold in 2014 to 2.2-fold in 2023. Butterflies showed a similar but weaker contrast, declining by 18 percent along hedgerows and by 35 percent along open edges."
      - "The microclimate record showed marked warming. Across the 18 instrumented transects, the mean number of days per season with afternoon air temperature above 30 degrees C rose from 4 in 2014-2015 to 11 in 2022-2023, and mean July temperature increased at a rate equivalent to 0.39 degrees C per decade, compared with 0.47 degrees C per decade reported for Port Calderan. In the mixed model, each 1 degree C increase in mean July temperature was associated with 8.4 percent lower wild bee abundance (95 percent confidence interval 4.9 to 11.7 percent), and each one-point increase in LSII with 6.1 percent lower abundance."
