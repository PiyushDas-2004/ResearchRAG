  - title: "Discussion"
    paragraphs:
      - "Our results agree with the general expectation that early, longer closures flatten epidemic curves more than they shrink them. In HARBOR-ABM the main gain from a four-week closure is time: a 23-day delay could matter for clinic staffing even though total infections fall by under 3 percentage points. The 35 percent reassignment of school contacts to the community layer was influential; in a sensitivity run with 60 percent reassignment, the four-week closure reduced the peak by only 19 percent."
      - "Using corrected step counts to scale adult contacts is, to our knowledge, new within the Harrowmere modelling literature, and the 4-day shift in peak timing without correction shows that measurement error in activity data is not merely a descriptive concern. We encourage environmental and clinical surveillance groups in the region to use the HARBOR-ABM synthetic population as a common denominator, so that rates computed from different data streams refer to the same population base."
  - title: "Limitations"
    paragraphs:
      - "HARBOR-ABM does not include vaccination, which would lower the attack rate and probably reduce the marginal benefit of closure. The synthetic population is based on an invented 2018 census and assumes that contact structure is static within a season. Children's community contacts were not informed by any activity data. Finally, sentinel ILI consultations are an imperfect proxy for infection, and we assumed a constant consultation probability of 0.18 across the season."
  - title: "Conclusion"
    paragraphs:
      - "HARBOR-ABM reproduces a held-out influenza-like illness season in fictional Harrowmere with 14.8 percent MAPE and suggests that early, four-week school closures delay and lower the epidemic peak substantially while changing cumulative infections only modestly. Late closures offer little. The model, the corrected activity scaling and the synthetic population are offered as a methods template rather than as guidance for any real setting."
