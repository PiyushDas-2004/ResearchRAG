  - title: "Discussion"
    paragraphs:
      - "The uniform degradation of FAST cells suggests that moisture enters through the bulk of the barrier rather than through a single weak path, which is the expected failure mode for a well-formed multilayer. The fluorinated siloxane appears to play two roles: it decouples pinholes in the two alumina layers, lengthening the diffusion path, and its low surface energy limits the condensation of water at the interface. Replacing it with a non-fluorinated siloxane in a small control set of 6 cells reduced T80 to 1,120 hours."
      - "The adapted DPSE protocol proved a useful complement to damp heat. Its milder steps separated GG-butyl from FAST only weakly, yet they revealed that unencapsulated cells begin to decompose at dew points that are common in uncontrolled factory air. Because DPSE was first defined for sulfide electrolytes, a shared protocol now exists across two very different moisture-sensitive materials, which should make cross-material comparisons of handling requirements easier."
      - "From a manufacturing perspective, the 3.5-hour process time per batch is the main drawback of FAST. Most of that time is spent on the two atomic layer deposition steps, which together account for about 2.8 hours. Spatial atomic layer deposition could shorten these steps considerably, and the siloxane layer is compatible with slot-die coating. Materials cost is modest, because the alumina layers are thin and the siloxane interlayer uses about 2.1 g of oligomer per square metre. We therefore see throughput, not materials, as the main obstacle to scale-up."
  - title: "Limitations"
    paragraphs:
      - "Our results come from 1.0 cm^2 cells, and barrier defects scale with area, so module-sized devices may perform worse. We did not perform outdoor exposure, ultraviolet preconditioning or mechanical load tests, and the delamination seen after thermal cycling indicates that adhesion between the siloxane and alumina layers needs further work. All devices used one absorber composition, and other perovskites with different volatile components might respond differently to the 85 degrees C deposition step."
  - title: "Conclusion"
    paragraphs:
      - "A thin-film trilayer of alumina and fluorinated siloxane, FAST, extended the damp-heat T80 of perovskite cells to 1,740 hours, nearly double that of glass-butyl packaging, at a cost of 0.3 percentage points of initial efficiency. Combined with an adapted Dew-Point Step Exposure protocol, these results show that direct thin-film encapsulation is a credible route to humidity-stable perovskite devices."
