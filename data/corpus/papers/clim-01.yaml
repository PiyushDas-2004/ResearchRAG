  - title: "Discussion"
    paragraphs:
      - "The divergence between zones fits a picture in which the low marsh, flooded twice daily and close to the river channel, receives enough mineral sediment to keep building upward, while the high marsh, flooded only on spring tides, is increasingly starved of sediment. Because the high marsh occupies 40 percent of the marsh area, its declining burial dominates the trend in total carbon storage. If high-marsh accretion continues to lag sea-level rise by 1.3 mm yr^-1, parts of it will convert to mid-marsh vegetation within a few decades, which could temporarily raise burial before open water eventually expands."
      - "The large Tarn River contribution links the marsh carbon budget to processes far upstream. The Tarn drains a catchment that includes the retreating Saelvik Glacier, and changes in glacial meltwater and sediment delivery could alter the supply on which the low marsh depends. We recommend that future hydrological monitoring of the Tarn report suspended sediment loads alongside discharge, so that the VCA-19 burial record can be connected to upstream supply. The marsh also serves as a cool, open reference landscape for nearby Port Calderan, and the high-marsh weather mast installed during our coring campaign has been retained for urban climate comparisons."
      - "Our estimates also bear on regional carbon accounting. The regional inventory had assumed a uniform burial rate of 210 g C m^-2 yr^-1 for the whole Vellmar marsh, which overstates the measured area-weighted rate by 27 percent and implies an annual sink of about 8,000 tonnes of carbon rather than 6,300 tonnes. Using zone-specific rates from VCA-19 would therefore lower the reported contribution of the estuary to regional carbon removals, and the downward trend in the high marsh suggests that the gap between assumed and actual burial will widen unless sediment supply increases."
  - title: "Limitations"
    paragraphs:
      - "Several limitations apply. Cores reached only 50 cm, so the record before about 1900 in the low marsh and before about 1800 in the high marsh is incomplete, and the 1960-1989 interval relies on the deeper and more compacted part of each core. The cesium-137 check was ambiguous in 9 of the 46 cores, so those chronologies rest on lead-210 alone. We did not measure methane emissions or lateral export of dissolved carbon, so burial rates should not be read as a net greenhouse gas balance for the marsh."
  - title: "Conclusion"
    paragraphs:
      - "Carbon burial in the Vellmar Estuary marsh averages 165 g C m^-2 yr^-1 but is falling in the high marsh, where accretion of 2.3 mm yr^-1 no longer keeps pace with 3.6 mm yr^-1 of relative sea-level rise. The Tarn River supplies most of the mineral sediment that sustains the low marsh, making the marsh sensitive to changes far up the catchment. The Vellmar Core Archive (VCA-19) is available for future work linking catchment change to coastal carbon storage."
