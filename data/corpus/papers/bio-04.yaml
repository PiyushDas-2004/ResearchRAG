  - title: "Discussion"
    paragraphs:
      - "The association between prior sleep and reaction time was consistent across schedules, suggesting that schedule differences in reaction outcomes are largely carried by differences in sleep duration. Because the device overestimates total sleep time, mainly by misclassifying quiet wakefulness, true sleep in the night group was probably even shorter than reported, which would bias the per-hour slope towards zero rather than inflate it. The estimated slope of 11.4 ms per hour is therefore best read as a conservative figure for this setting."
      - "The device validation is a useful counterpart to the step-count work in the HALO cohort. The 7.3 percent MAPE for total sleep time is similar in size to the pooled step-count MAPE reported for the same device, yet the error structures differ: steps are undercounted during slow movement, while sleep is overcounted during still wakefulness. Studies that use one wrist device for both activity and sleep should therefore not assume that a single validation covers both measures."
  - title: "Limitations"
    paragraphs:
      - "The study has several limitations. Workers self-selected into schedules, so fixed night workers may differ in chronotype, family duties or second jobs that we did not measure. The polysomnography substudy took place in a laboratory, where sleep is usually more consolidated than at home after a night shift, so field device error may be larger than the 7.3 percent observed. BriefPVT-5 is shorter than standard vigilance tests and may be less sensitive to mild impairment. We did not record workplace incidents, and the results should not be read as evidence about safety outcomes."
  - title: "Conclusion"
    paragraphs:
      - "In 96 fictional shift workers, fixed night and rotating schedules were associated with shorter device-measured sleep, and shorter prior sleep predicted slower reactions and more lapses within individuals. A wrist device validated for both steps and sleep made four weeks of continuous measurement feasible, but its errors were measure-specific. NIGHTSHIFT-RT is offered as a methods example for linking wearable sleep data to brief performance tests."
