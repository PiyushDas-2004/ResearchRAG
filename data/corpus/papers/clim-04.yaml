          - ["T3 Brennick", "72", "23", "13.8"]
          - ["T4 Calderan Weir", "104", "12", "18.1"]
          - ["T5 Estuary mouth", "112", "9", "19.6"]
  - title: "Discussion"
    paragraphs:
      - "Saelvik meltwater is a strong control on water temperature in the upper and middle Tarn but has almost no thermal influence on the lower river and estuary, where warming tracks air temperature and urban runoff from Port Calderan. The upper river is therefore protected for now, but this protection is temporary. The SMBM projects that meltwater yield will peak around 2035 and then decline, by which time the cooling effect at Brennick could weaken by roughly half as the glacier contribution shrinks."
      - "The decline of meltwater will also affect sediment. Glacial erosion is a major source of fine sediment in the Tarn, and the load of 0.84 million tonnes per year at the estuary mouth helps explain why the low marsh of the Vellmar Estuary has kept pace with sea-level rise. A post-peak decline in glacial sediment could reduce the supply on which marsh accretion depends. Coupling the TRTA with the Vellmar Core Archive (VCA-19) and with riparian temperature measurements near the Brennick pollinator transects would allow the effects of glacier loss to be traced from the ice to the coast."
      - "The contrast between upper and lower river also shapes how warming is experienced along the valley. Near the snout, July water temperature showed no trend over two decades despite rising air temperatures, because increasing melt compensated for warmer air. Downstream, the estuary warming rate of 0.28 degrees C per decade is lower than the summer air warming of 0.47 degrees C per decade reported for Port Calderan, reflecting the thermal inertia of the deeper lower channel and tidal mixing with cooler bay water. Once melt yield declines after peak water, the upper river is likely to lose its present stability first."
  - title: "Limitations"
    paragraphs:
      - "The study has limitations. Ice damage during winter floods destroyed or displaced 6 of the 27 loggers at various times, leaving gaps that were filled by interpolation from neighbouring sites. Two-component separation cannot distinguish meltwater from groundwater that was itself recharged by melt in previous years, so meltwater fractions may be underestimated in the middle river. The SMBM uses a degree-day approach that ignores debris cover, which increased on the lower glacier tongue over the study period and may slow future melt. Finally, our temperature regressions are correlative and we did not model river heat budgets explicitly, so the attribution of cooling to meltwater rather than to shading in the Haldor Gorge reach remains uncertain."
  - title: "Conclusion"
    paragraphs:
      - "Saelvik Glacier meltwater supplies about two thirds of July flow below the snout and measurably cools the river as far as Brennick, but its influence fades below river km 90. The lower Tarn and its estuary are warming at 0.28 degrees C per decade regardless of meltwater. As the glacier approaches peak water around 2035, both the thermal buffering of the upper river and the sediment supply to the Vellmar Estuary are likely to decline."
