key: clim-04
title: "Saelvik Glacier Meltwater Cools the Upper Tarn River but Not Its Estuary"
authors: ["Eirik Thornquist-Abara", "Lucia Fenmore", "Dawit Halvarsen-Ruiz", "Noor Castellane"]
affiliation: "Glacier and River Observatory, Skarnvik University"
year: 2025
venue: "Journal of Invented Cryosphere Hydrology"
doi: "10.5555/rrsyn.2025.clim04"
arxiv_id: "2599.02748"
keywords: ["glacier meltwater", "river temperature", "hydrograph separation", "peak water", "thermistor array"]
abstract: >-
  Glacier retreat changes both the quantity and the temperature of water delivered to downstream
  rivers. We combined the 27-logger Tarn River Thermistor Array (TRTA), spanning 112 km from the
  Saelvik Glacier snout to the Vellmar Estuary, with oxygen-18 hydrograph separation of 340 water
  samples collected between 2019 and 2024. Saelvik Glacier covered 14.2 km^2 in 2024, 19 percent
  less than in 2003, and its terminus retreated by a mean of 31 m per year. Meltwater made up 68
  percent of July discharge 5 km below the snout but only 9 percent at the estuary mouth. Each 10
  m^3/s increase in meltwater discharge lowered July water temperature at the Brennick gauge by
  0.62 degrees C, while the effect was undetectable below river km 90. July water temperature at
  the estuary mouth warmed by 0.28 degrees C per decade over 2005-2024. The Saelvik Melt Balance
  Model projects peak meltwater around 2035.
sections:
  - title: "Introduction"
    paragraphs:
      - "Glaciers act as cold reservoirs that release water during the warmest weeks of the year, keeping downstream rivers cooler and more stable than rain-fed rivers. As glaciers shrink, meltwater yield first rises and then falls once the ice area becomes too small, a transition often called peak water. The Saelvik Glacier, a valley glacier at the head of the Tarn River catchment, is the largest remaining ice body in the region, and the Tarn flows 112 km from its snout through the Brennick Lowlands and the city of Port Calderan before entering the Vellmar Estuary."
      - "Downstream communities and ecosystems depend on the Tarn in different ways. Cold-water fish habitat in the upper river depends on summer meltwater, farms in the Brennick Lowlands draw irrigation water from the middle river, and the Vellmar Estuary marsh receives much of its mineral sediment from the Tarn, estimated at 58 percent by Achterberg-Nwosu et al. (2021). Yet no study had traced how far downstream the cooling influence of Saelvik meltwater extends. Our aims were to measure the meltwater fraction of summer discharge along the river, to quantify its effect on water temperature, and to assess how these patterns may change as the glacier approaches peak water."
  - title: "Methods"
    paragraphs:
      - "The Tarn River Thermistor Array (TRTA) consists of 27 submerged temperature loggers installed in 2004 and 2005 at intervals of 3 to 6 km from river km 2 to km 112, recording every 15 minutes. Five of the loggers are co-located with discharge gauges, which we label T1 (snout gauge, km 5), T2 (Haldor Gorge, km 31), T3 (Brennick, km 72), T4 (Calderan Weir, km 104) and T5 (estuary mouth, km 112). We analysed July data because July combines maximum melt with the highest air temperatures of the year."
      - "To separate meltwater from rain and groundwater we used two-component hydrograph separation based on oxygen-18. Between 2019 and 2024 we collected 340 water samples at the five gauges, together with end-member samples from the glacier portal and from tributaries draining unglaciated slopes. Glacier area and terminus position were mapped from annual aerial imagery from 2003 to 2024. We related daily mean water temperature at each gauge to meltwater discharge using regression with air temperature and day of year as covariates. Suspended sediment was sampled monthly at T5 to estimate the load delivered to the estuary."
      - "Future meltwater yield was projected with the Saelvik Melt Balance Model (SMBM), a degree-day model with separate melt factors for snow and ice, calibrated against stake measurements on the glacier from 2010 to 2024. The model was driven by downscaled temperature scenarios that warm the catchment by 0.43 degrees C per decade, a rate between the summer warming trends reported for the Brennick Lowlands and for Port Calderan."
  - title: "Results"
    paragraphs:
      - "Saelvik Glacier covered 14.2 km^2 in 2024, down 19 percent from 17.5 km^2 in 2003, and its terminus retreated by a mean of 31 m per year over the same period. July meltwater discharge at T1 rose over the record, with the highest daily peak, 47 m^3/s, recorded on 9 July 2022. Mean July discharge at T1 over 2019-2024 was 29 m^3/s, compared with 21 m^3/s over 2005-2010, an increase of 38 percent consistent with a glacier still on the rising limb of its meltwater curve. The SMBM reproduced observed July melt discharge at T1 with a mean absolute error of 2.6 m^3/s."
      - "The meltwater fraction of July discharge declined steadily downstream as tributaries and groundwater joined the river (Table 1). Meltwater made up 68 percent of discharge at the snout gauge, 23 percent at Brennick and 9 percent at the estuary mouth. Mean July water temperature rose correspondingly, from 4.3 degrees C at T1 to 13.8 degrees C at Brennick and 19.6 degrees C at the estuary mouth."
      - "The cooling influence of meltwater weakened with distance. At Brennick, each 10 m^3/s increase in meltwater discharge was associated with a 0.62 degrees C lower daily mean water temperature, after accounting for air temperature. At Calderan Weir the effect fell to 0.17 degrees C, and below river km 90 it was not distinguishable from zero. Over 2005-2024, July water temperature at the estuary mouth warmed by 0.28 degrees C per decade, while at T1 no trend was detectable. Suspended sediment load at T5 averaged 0.84 million tonnes per year."
