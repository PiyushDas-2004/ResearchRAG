  - title: "Discussion"
    paragraphs:
      - "The asymmetry between fabrication and misattribution is the central finding. Retrieval gives the model real references to cite, so it no longer needs to invent them, but it does not guarantee that the model attaches each reference to a claim the reference supports. Because misattributed citations survive a simple existence check, evaluations that report only fabrication rates will overstate the reliability of retrieval-grounded summaries. The poor recall of CiteProbe on misattribution shows that automatic checking is not yet a substitute for reading the cited work."
      - "Our trace analysis links part of the remaining error to retrieval and segmentation. When the retrieved chunk is topically close to a claim without containing it, the generator appears to treat proximity as support. Earlier work on chunking found that answers split across chunk boundaries cause a measurable share of retrieval misses even at moderate overlap, and the 19 percent of misattributions whose support lay just outside the retrieved chunk is consistent with that observation. Better chunking may therefore reduce misattribution, not only improve recall."
  - title: "Limitations"
    paragraphs:
      - "The study covers two scientific fields, English-language summaries and four anonymised models, and the rates we report should not be read as properties of any particular commercial system. The retrieval pipeline was fixed, so we cannot separate the contributions of the retriever, the reranker and the chunking configuration. Annotators were domain experts, and the cost of 612 annotator-hours limits how often such a study can be repeated. Finally, the existence step depends on the coverage of our reference database, so a small number of real but obscure works may have been labelled fabricated."
  - title: "Conclusion"
    paragraphs:
      - "Retrieval grounding reduced fabricated citations in LLM-generated literature summaries from 21.3 percent to 3.9 percent, but misattributed citations remained at 8.7 percent and largely escaped automatic detection. We release the VeriCite guidelines, the 9,612 adjudicated labels and the annotator justifications, and we encourage evaluations of citation quality to report misattribution alongside fabrication. Future work should test whether larger retrieval contexts or claim-level verification before generation can close the remaining gap."
