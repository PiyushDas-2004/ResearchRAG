  - title: "Discussion"
    paragraphs:
      - "We interpret the improved stability of NFM-felt as a result of molybdate anchoring the iron sites. Molybdate is partly released in the first hours of operation, as reported for other oxoanion-modified catalysts, but the fraction retained, about 44 percent after 2,000 hours, appears sufficient to slow iron loss during potential excursions. Growing the catalyst directly on felt also removed the binder, eliminating a delamination pathway that is common with sprayed catalyst inks."
      - "The staged structure of IRLP-24 was essential to this conclusion. Averaged over 1,200 hours, both catalysts would simply look worse under intermittent load, but the stage-wise rates show that the penalty grows with each additional shutdown and that NFM-felt degrades less steeply. As with the GSPC protocol for solid-state cells, separating the stages makes it possible to say which stress is responsible for which share of the loss, and we suggest IRLP-24 as a shared profile for other technologies coupled to variable renewable supply, including thermal storage."
      - "For system designers, the most practical number is the stage 3 rate, because sites with high renewable shares can see six or more shutdowns on windy days. At 59 microvolts per hour, an NFM-felt cell operated under such conditions for 8,000 hours a year would accumulate a voltage rise of roughly 0.47 V, far beyond typical end-of-life criteria. Mitigation at system level, such as protective polarisation currents during shutdown or a small heated buffer that keeps the stack warm, is therefore likely to remain necessary even with improved catalysts."
  - title: "Limitations"
    paragraphs:
      - "The study was limited to single 25 cm^2 cells, and reverse currents in multi-cell stacks are larger than in a single cell because of shunt paths through the shared electrolyte, so the IRLP-24 rates may underestimate stack degradation. The IRLP-24 profile is synthetic and does not include the seasonal variability of a real site. We also used high-purity electrolyte, and the effect of iron or carbonate impurities typical of industrial potassium hydroxide was not examined. Finally, we did not measure gas purity, so the effect of the catalyst on oxygen crossover into the hydrogen stream remains unknown."
  - title: "Conclusion"
    paragraphs:
      - "Molybdate intercalation and binder-free growth on nickel felt produced an oxygen evolution catalyst, NFM-felt, with an overpotential of 214 mV at 10 mA/cm^2 and a degradation rate of 38 microvolts per hour under the IRLP-24 intermittent protocol, less than half that of the molybdate-free reference. Staged intermittent testing should become routine for catalysts intended for renewable-powered electrolysis."
