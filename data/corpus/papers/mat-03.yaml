key: mat-03
title: "Molybdate-Intercalated Nickel-Iron Hydroxide on Nickel Felt for Durable Alkaline Water Electrolysis Under Intermittent Load"
authors: ["Haldis Brennecke", "Arjun Vellacott", "Mirela Szandor"]
affiliation: "Electrocatalysis Group, Lake Orvane Institute for Hydrogen Research"
year: 2023
venue: "Journal of Invented Electrocatalysis"
doi: "10.5555/rrsyn.2023.mat03"
arxiv_id: "2399.08812"
keywords: ["alkaline water electrolysis", "oxygen evolution", "nickel-iron catalyst", "overpotential", "durability"]
abstract: >-
  Alkaline electrolysers powered by wind and solar must survive frequent ramps and shutdowns, which
  degrade nickel-iron oxygen evolution catalysts faster than steady operation. We report NFM-felt, a
  molybdate-intercalated nickel-iron layered hydroxide with a Ni to Fe ratio of 3 to 1 grown directly
  on porous nickel felt at a loading of 2.6 mg/cm^2. In 1 M potassium hydroxide at 25 degrees C,
  NFM-felt required an overpotential of 214 mV to reach 10 mA/cm^2, with a Tafel slope of 37 mV/dec.
  In a 25 cm^2 zero-gap cell at 80 degrees C, the cell voltage at 1 A/cm^2 was 1.79 V, a voltage
  efficiency of 82.7 percent on a higher heating value basis. We also define the Intermittent
  Renewable Load Profile (IRLP-24) protocol, under which NFM-felt degraded by 38 microvolts per hour
  over 1,200 hours, compared with 96 microvolts per hour for a molybdate-free reference.
sections:
  - title: "Introduction"
    paragraphs:
      - "Alkaline water electrolysis is the most mature route to low-carbon hydrogen, and earth-abundant catalysts are already standard practice on the anode, where nickel-iron hydroxides are the leading oxygen evolution catalysts. Their initial activity is excellent, but their durability under the variable power of renewable sources is less well understood. During shutdowns, the anode potential falls and reverse currents flow through the shared manifolds of a stack, partially reducing the catalyst and promoting iron dissolution."
      - "Most durability studies, however, hold the electrolyser at a constant current density for a few hundred hours, which does not reproduce these events. In this paper we make two contributions. First, we present NFM-felt, a nickel-iron hydroxide stabilised by molybdate anions in its interlayer and grown directly on a three-dimensional nickel felt. Second, we propose a staged intermittent test, IRLP-24, that increases the frequency of shutdowns over time so that the sensitivity of a catalyst to cycling can be measured rather than averaged away."
  - title: "Related Work"
    paragraphs:
      - "Nickel-iron hydroxides with iron fractions between 15 and 30 percent typically show overpotentials of 230 to 280 mV at 10 mA/cm^2 in 1 M hydroxide. Intercalation of oxoanions such as carbonate, borate or molybdate has been reported to modify the interlayer spacing and the local electronic structure of nickel sites. Durability protocols for alkaline cells remain heterogeneous. Our staged design borrows directly from the Graded Stack Pressure Cycling protocol of Vashkell et al. (2021), which was developed for solid-state batteries and reports degradation separately for each stress stage, so that the effect of an increasing stress can be read off one long test."
  - title: "Methods"
    paragraphs:
      - "NFM-felt was prepared by a one-step hydrothermal reaction at 120 degrees C for 10 hours. Nickel felt with 86 percent porosity and 1.7 mm thickness was immersed in an aqueous solution of nickel nitrate, iron nitrate, sodium molybdate and urea, with the metal salts in a 3 to 1 Ni to Fe ratio. The resulting catalyst loading was 2.6 mg/cm^2. The reference catalyst NF-ref was made by the same route without molybdate, and bare nickel felt served as a third comparison. Iron content and leaching were quantified by inductively coupled plasma analysis."
      - "Half-cell measurements were made in purified 1 M potassium hydroxide at 25 degrees C in a three-electrode cell, with 90 percent ohmic correction. Full-cell tests used a 25 cm^2 zero-gap cell with a Raney-nickel cathode, a 220 micrometre porous separator and 30 weight percent potassium hydroxide at 80 degrees C. Three cells were tested for each anode, and reported values are means."
      - "The IRLP-24 protocol applies a repeating 24-hour current profile derived from a synthetic hybrid wind and solar output, ranging between 0 and 1 A/cm^2, with ramp rates up to 0.2 A/cm^2 per minute. The 1,200-hour test is divided into three 400-hour stages with 2, 4 and 6 full shutdowns per day respectively, each shutdown lasting 20 minutes at open circuit. Degradation is reported as the rate of increase in cell voltage at 500 mA/cm^2, measured in a reference hold at the same time each day. A separate constant-current test held cells at 500 mA/cm^2 for 2,000 hours."
  - title: "Results"
    paragraphs:
      - "In half-cell tests, NFM-felt reached 10 mA/cm^2 at an overpotential of 214 mV and 100 mA/cm^2 at 251 mV, with a Tafel slope of 37 mV/dec. NF-ref needed 247 mV at 10 mA/cm^2 and showed a Tafel slope of 49 mV/dec, while bare nickel felt needed 342 mV. In the zero-gap cell at 80 degrees C, NFM-felt gave 1.79 V at 1 A/cm^2, corresponding to a voltage efficiency of 82.7 percent based on the higher heating value of hydrogen, compared with 1.86 V for NF-ref."
      - "Under constant current at 500 mA/cm^2, NFM-felt cells degraded by only 11 microvolts per hour over 2,000 hours, a total voltage rise of 22 mV, and inductively coupled plasma analysis showed an iron loss of 0.8 percent of the initial inventory. Intermittent operation was markedly harsher. Over the full IRLP-24 test NFM-felt degraded at a mean rate of 38 microvolts per hour, more than three times its constant-current rate, while NF-ref degraded at 96 microvolts per hour and lost 4.6 percent of its iron."
      - "Table 2 shows that degradation accelerated with shutdown frequency for both catalysts, but the rise was steeper without molybdate. Between the first and third stages, the rate for NFM-felt increased from 21 to 59 microvolts per hour, while NF-ref increased from 58 to 138 microvolts per hour. Post-test Raman spectra of NF-ref showed a growing nickel oxyhydroxide band and a loss of the iron-related signal, consistent with iron dissolution during reverse-current events."
