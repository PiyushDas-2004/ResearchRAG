  - title: "Discussion"
    paragraphs:
      - "The results suggest that the weight given to lexical evidence should be a property of the query rather than of the collection. A practical consequence is that BraidRank can be placed in front of a reranker without retuning, since its candidate lists are already balanced across query types. The failure analysis also points to segmentation as a hidden variable: passages of a fixed 180 words sometimes separate a claim from its supporting number, and we expect chunking choices to interact with hybrid retrieval in ways this paper does not explore."
  - title: "Limitations"
    paragraphs:
      - "QuarryQA covers only three scientific fields and only English text, so the reported gains may not transfer to clinical, legal or multilingual collections. The question-writing protocol reduces lexical overlap but cannot remove it, and annotators may still have favoured distinctive terms when writing from memory. Finally, all latency numbers come from a single hardware configuration and do not include network overhead in a distributed deployment."
  - title: "Conclusion"
    paragraphs:
      - "BraidRank shows that a lightweight, query-adaptive fusion weight lets a hybrid retriever outperform both its sparse and dense components on scientific passage retrieval, raising Recall@100 to 0.874 on QuarryQA at a mean cost of 38 ms per query. We release the QuarryQA splits and the fusion regressor to support further work on second-stage reranking and on passage segmentation for long scientific documents."
