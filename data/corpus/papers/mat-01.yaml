  - title: "Discussion"
    paragraphs:
      - "The stage-wise reporting of GSPC turned out to be more informative than the headline cycle count. Both electrolytes faded at a moderate rate in the first stage, which suggests that bulk cathode ageing dominates while pressure is high. The materials separated most clearly once pressure was halved. We attribute the better behaviour of BrAG-6 to its lower elastic modulus, measured by nanoindentation at 18.2 GPa versus 23.5 GPa for CLAG-0, which allows the electrolyte to follow the volume changes of the cathode particles and keep contact."
      - "Rate tests outside the GSPC run gave a consistent picture. At 3C and 10 MPa, BrAG-6 cells delivered 151 mAh/g, or about 80 percent of their 1C capacity, while CLAG-0 cells delivered 126 mAh/g. At 2.5 MPa the 3C capacity of BrAG-6 dropped to 139 mAh/g, showing that interfacial resistance still rises when pressure is low even for the softer electrolyte."
      - "The DPSE results show that bromide substitution also slows hydrolysis, although it does not prevent it. A release of 0.11 cm^3/g is still too high for open-air processing, so dry rooms remain necessary. We see the main value of DPSE as a common yardstick: because it reports gas release and conductivity retention at fixed dew points, it can be applied to other moisture-sensitive energy materials, and we encourage groups working on halide perovskites or hygroscopic salts to adapt it."
  - title: "Limitations"
    paragraphs:
      - "This study has several limitations. All cells used a lithium-indium alloy anode rather than lithium metal, so dendrite formation was not tested. Cycling was carried out only at 25 degrees C, and the lowest GSPC pressure of 2.5 MPa is still higher than the clamping available in many module designs. Cells were small pellet cells of 1.13 cm^2 area, and we did not assess how BrAG-6 behaves in thin, sheet-cast separators with polymer binders."
  - title: "Conclusion"
    paragraphs:
      - "Partial bromide substitution produced an argyrodite electrolyte, BrAG-6, with an ionic conductivity of 7.4 mS/cm and markedly better tolerance of reduced stack pressure. Under the GSPC protocol its cells retained 82.4 percent of capacity after 1,200 cycles. We propose GSPC and DPSE as simple, stress-revealing protocols for comparing solid electrolytes and other sensitive energy materials."
