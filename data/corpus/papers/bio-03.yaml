  - title: "Discussion"
    paragraphs:
      - "The hospital-adjacent site illustrates both the value and the risk of sub-sewershed sampling. It reveals a hotspot that would be diluted at the treatment plant, but it also reflects a small, atypical contributing population, and its numbers should not be read as describing the wider catchment. Network-level summaries such as the median of site medians are less sensitive to a single unusual site and are what we recommend for routine reporting."
      - "The winter rise in blaCTX-M and its modest correlation with respiratory consultations are consistent with seasonal changes in antibiotic use, but the network cannot establish that link, because prescribing data were not available. Forecast accuracy was lower than reported for the HARBOR-ABM respiratory model, whose out-of-sample weekly MAPE was 14.8 percent, which is unsurprising given the noisier laboratory signal and the absence of a mechanistic transmission model behind ResiCast. Sharing the HARBOR-ABM population base made such comparisons straightforward."
  - title: "Limitations"
    paragraphs:
      - "Several limitations apply. We did not culture organisms or link genes to specific hosts, so carriage cannot be attributed to people rather than to sewer biofilms. Relative abundance depends on the 16S rRNA gene, whose copy number varies between taxa. Five towns were represented by a single influent site each, and rainfall events reduced sampling completeness at Morrowgate in particular. The 70-week window covers only one full winter, so the seasonal estimate rests on limited data. Finally, ResiCast was evaluated on a single 30-week test window, and its accuracy may differ in seasons with unusual rainfall."
  - title: "Conclusion"
    paragraphs:
      - "SEWERWATCH-12 achieved a 97.3 percent quality-control pass rate on a twice-weekly schedule across twelve fictional sites, revealed a hospital-adjacent hotspot for blaCTX-M, and supported one-week-ahead forecasts with 18.4 percent MAPE. Aligning population denominators with an existing city model allows wastewater resistance data to be read alongside respiratory surveillance, which we see as the main practical lesson of the network. A second phase will add prescribing data and a third winter of sampling."
