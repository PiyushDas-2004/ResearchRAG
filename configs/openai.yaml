# Live OpenAI configuration (needs OPENAI_API_KEY). Model names were checked against OpenAI's
# model pages on 2026-11-20; verify they are still current before use. Prices: configs/pricing.yaml.
name: openai
chunking: {strategy: parent_child, chunk_tokens: 160, overlap_tokens: 32, parent_tokens: 480, tokenizer: "tiktoken:cl100k_base"}
embedding: {provider: openai, model: text-embedding-3-small, dimension: 1536, batch_size: 128, requests_per_minute: 500}
retrieval: {mode: hybrid, candidate_k: 40, top_k: 8, rrf_k: 60, mmr_enabled: true, mmr_lambda: 0.7, ef_search: 64}
rewrite: {enabled: false, multi_query: 2, condense_followups: true}
rerank: {provider: lexical, top_n: 24}
generation:
  provider: openai
  model: gpt-5-mini
  temperature: null          # some reasoning models only accept the default temperature
  max_output_tokens: 2000
  max_context_tokens: 3000
  min_evidence_score: 0.34
verification: {enabled: true, judge: llm, policy: remove, regenerate_on_failure: true}
security: {injection_action: sanitize, output_guard: true}
